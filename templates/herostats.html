<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{PLAYER_NAME}} - {{MODE_LABEL}}英雄统计</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F6F2;
            --surface: #FFFFFF;
            --border: #E5DDD4;
            --border-s: #EDE8E1;
            --t1: #1C1917;
            --t2: #6B5C55;
            --t3: #A8968F;
            --accent: #D4713A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--t1);
            padding: 28px 32px 32px;
        }
        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .lbl {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--t3);
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 11px 14px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--t3);
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        th.r { text-align: right; }
        td {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--t2);
            border-bottom: 1px solid var(--border-s);
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--bg); }
    </style>
</head>
<body>

    <div class="card" style="padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">{{PLAYER_NAME}}</div>
            <div style="margin-top: 4px;"><span class="lbl">{{MODE_LABEL}}英雄使用统计</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 26px; font-weight: 700; color: var(--t1); letter-spacing: -0.03em;">{{HERO_COUNT}}</div>
            <div class="lbl" style="margin-top: 2px;">英雄数</div>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th style="width: 32px;">#</th>
                    <th>英雄</th>
                    <th class="r">场次</th>
                    <th class="r">胜率</th>
                    <th class="r">KDA</th>
                    <th class="r">等级</th>
                </tr>
            </thead>
            <tbody>
                {{HERO_ROWS}}
            </tbody>
        </table>
    </div>
    <div style="text-align:center;padding:6px 0 4px;font-size:11px;color:#A8968F;">守望先锋 2 · {{MODE_LABEL}}英雄统计 · 机器人反馈群 412275154</div>

</body>
</html>
