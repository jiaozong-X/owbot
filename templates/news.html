<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>活动资讯</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #F8F6F2;
            --surface:   #FFFFFF;
            --border:    #E5DDD4;
            --border-s:  #EDE8E1;
            --t1:        #1C1917;
            --t2:        #6B5C55;
            --t3:        #A8968F;
            --accent:    #D4713A;
            --accent-bg: #FBF0E8;
            --event-bg:  #FFF8F3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--bg); }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--t1);
            padding: 28px 32px 32px;
            width: 860px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .header-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931A 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .header-date { font-size: 12px; color: var(--t3); margin-top: 2px; }
        .header-sub { font-size: 12px; color: var(--t3); margin-left: auto; text-align: right; }

        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--t3);
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border-s);
        }

        .event-item {
            display: flex;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-s);
            transition: background 0.15s;
        }
        .event-item:last-child { border-bottom: none; }
        .event-item:hover { background: var(--event-bg); }

        .event-num {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: var(--accent-bg);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .event-content { flex: 1; min-width: 0; }
        .event-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--t1);
            margin-bottom: 6px;
        }
        .event-desc {
            font-size: 13px;
            color: var(--t2);
            line-height: 1.6;
        }

        .no-data {
            padding: 40px 20px;
            text-align: center;
            color: var(--t3);
            font-size: 14px;
        }

        .footer {
            margin-top: 14px;
            font-size: 12px;
            color: var(--t3);
            text-align: center;
        }
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="header-title">守望先锋 · 活动资讯</div>
            <div class="header-date">{{DATE}}</div>
        </div>
        <div class="header-sub">网易国服官网</div>
    </div>

    <div class="card">
        <div class="section-title">近期活动</div>
        {{EVENTS}}
    </div>

    <div class="footer">
        数据来源：<a href="https://ow.blizzard.cn/news/patch-notes/live/">ow.blizzard.cn</a> &nbsp;·&nbsp; 机器人反馈群 412275154
    </div>

</body>
</html>
